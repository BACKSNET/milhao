<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milhão.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#0B6E4F; --verde-2:#0F8A62; --verde-claro:#E3F0EA;
  --tinta:#13241C; --tinta-2:#4A5D53; --tinta-3:#7B8C83;
  --papel:#F4F7F5; --branco:#FFFFFF; --linha:#DCE4DF; --linha-2:#EBF0ED;
  --queda:#B93A26; --queda-claro:#F7E4E0;
  --ouro:#A97A1C; --ouro-claro:#F5ECD8;
  --fonte:"Archivo","Helvetica Neue",Arial,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--fonte);font-size:15px;line-height:1.45}
body{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
.marca{font-weight:850;font-stretch:125%;font-variation-settings:"wdth" 125;letter-spacing:-.02em;color:var(--verde);line-height:1}
h1,h2,h3{margin:0;line-height:1.15}
h1{font-size:30px;font-weight:750;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700}
h3{font-size:15px;font-weight:650}
.sutil{color:var(--tinta-2)}
.fraco{color:var(--tinta-3);font-size:13px}
.alta{color:var(--verde)} .baixa{color:var(--queda)}
.ouro{color:var(--ouro)}
.btn{border:1px solid var(--linha);background:var(--branco);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:550}
.btn:hover{border-color:var(--tinta-3)}
.btn.primario{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.primario:hover{background:var(--verde-2)}
.btn.texto{border:none;background:none;padding:6px 8px;color:var(--verde)}
.btn.perigo{color:var(--queda)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select{
  border:1px solid var(--linha);background:var(--branco);border-radius:8px;padding:8px 10px;width:100%}
label.campo{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--tinta-2);font-weight:550}
.oculto{display:none!important}

/* ---------- entrada ---------- */
.entrada{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.entrada-arte{background:var(--tinta);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;isolation:isolate}
.entrada-arte p{max-width:420px;color:#C9D6CF;font-size:17px;position:relative;margin:0;z-index:2}
.entrada-arte::after{content:"";position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(transparent,var(--tinta) 65%);z-index:1;pointer-events:none}
/* marca */
.logo{display:inline-flex;align-items:center;gap:.22em;line-height:1;white-space:nowrap}
.logo .logo-m{width:1.05em;height:1.05em;flex:none}
.logo-nome{font-weight:850;font-stretch:125%;font-variation-settings:"wdth" 125;letter-spacing:-.025em;color:var(--verde)}
.logo-nome i{font-style:normal;color:#2FCB8F}
.logo.grande{font-size:clamp(60px,7.4vw,118px)}
.logo.grande .logo-nome{color:#fff}
.logo.media{font-size:38px}
.logo.pequena{font-size:27px}
.marca-link{text-decoration:none;padding:0 8px;display:inline-block}
/* lupa sobre a marca */
.lupa-area{position:relative;align-self:flex-start;cursor:none;z-index:2;padding:6px}
.lupa{position:absolute;left:0;top:0;width:150px;height:150px;border-radius:50%;overflow:hidden;pointer-events:none;
  background:var(--tinta);border:3px solid #E9F7F0;box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.25);
  opacity:0;scale:.6;transition:opacity .18s,scale .18s}
.lupa::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.28),transparent 46%)}
.lupa-conteudo{position:absolute;left:0;top:0;transform-origin:0 0;padding:6px}
.lupa-area.com-lupa .lupa{opacity:1;scale:1}
/* velas */
.velas{position:absolute;left:0;right:0;bottom:118px;width:100%;height:230px;z-index:1}
.velas .vela{transform-box:fill-box;transform-origin:50% 100%;animation:vela-sobe .5s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i) * 22ms)}
@keyframes vela-sobe{from{opacity:0;transform:scaleY(.2)}to{opacity:1;transform:none}}
/* telão de cotações ao fundo */
.telao{position:absolute;inset:-25% -20%;z-index:0;opacity:.17;transform:perspective(1100px) rotateX(24deg) rotateZ(-9deg);
  -webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 30%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 45%,#000 30%,transparent 72%);pointer-events:none}
.telao-rolo{animation:telao-rola 90s linear infinite}
.telao-grade{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding-bottom:2px}
.telao-grade div{background:rgba(47,203,143,.07);border:1px solid rgba(47,203,143,.18);padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.telao-grade b{font-size:15px;letter-spacing:.02em;color:#E9F7F0}
.telao-grade span{font-size:13px;color:#C9D6CF}
.telao-grade em{font-style:normal;font-size:13px;font-weight:700}
.telao-grade .sobe{color:#2FCB8F}.telao-grade .desce{color:#F08A75}
@keyframes telao-rola{to{transform:translateY(-50%)}}
@media (prefers-reduced-motion:reduce){.telao-rolo,.velas .vela{animation:none}.lupa{transition:none}}
@media (hover:none){.lupa{display:none}.lupa-area{cursor:auto}}
.entrada-form{display:flex;align-items:center;justify-content:center;padding:28px}
.entrada-form form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:11px}
.entrada-form h1{margin-bottom:4px}
.entrada-form label.campo{gap:3px}
.entrada-form .nota{font-size:13px;color:var(--tinta-3)}
.entrada-form .esqueci{font-size:14px;color:var(--verde);font-weight:600;margin-top:-6px;align-self:flex-start}
.entrada-form .sutil a{color:var(--verde);font-weight:600}
.erro-login{margin:0;background:var(--queda-claro);color:var(--queda);border-radius:8px;padding:10px 12px;font-size:14px}

/* ---------- moldura ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;background:linear-gradient(to right,var(--branco) 247px,var(--linha) 247px,var(--linha) 248px,transparent 248px)}
.lateral{padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.lateral .marca{font-size:30px;padding:0 8px}
.lateral .marca-link{margin-bottom:2px}
.carteira-atual{border:1px solid var(--linha);border-radius:var(--r);padding:10px 12px;cursor:pointer;background:var(--papel);text-align:left;width:100%}
.carteira-atual small{display:block;color:var(--tinta-3);font-size:12px}
.carteira-atual strong{font-weight:650}
nav.menu{display:flex;flex-direction:column;gap:2px}
nav.menu a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;font-weight:550;color:var(--tinta-2)}
nav.menu a:hover{background:var(--papel);color:var(--tinta)}
nav.menu a.ativo{background:var(--verde-claro);color:var(--verde)}
nav.menu svg{width:18px;height:18px;flex:none}
.lateral .rodape{margin-top:auto;font-size:12px;color:var(--tinta-3);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.principal{min-width:0}
.topo{display:flex;align-items:center;gap:16px;padding:16px 36px;border-bottom:1px solid var(--linha);background:var(--papel);position:sticky;top:0;z-index:5}
.busca{position:relative;flex:1;max-width:520px}
.busca input{padding-left:36px;background:var(--branco)}
.busca svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--tinta-3)}
.sugestoes{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);box-shadow:0 8px 24px rgba(19,36,28,.08);overflow:hidden;z-index:20}
.sugestoes button{display:flex;width:100%;gap:12px;align-items:baseline;padding:9px 12px;border:none;background:none;cursor:pointer;text-align:left}
.sugestoes button:hover,.sugestoes button.sel{background:var(--papel)}
.sugestoes b{width:64px;flex:none}
.topo .usuario{margin-left:auto;font-size:13px;color:var(--tinta-2)}
/* barra de serviços da tela inicial */
.barra-topo{position:sticky;top:0;z-index:6;background:var(--branco);border-bottom:1px solid var(--linha)}
.barra-dentro{max-width:1280px;margin:0 auto;padding:10px 36px;display:flex;align-items:center;gap:20px}
.barra-topo .marca-link{padding:0}
.barra-topo .logo.pequena{font-size:24px}
.servicos{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:none}
.servicos::-webkit-scrollbar{display:none}
.servicos a{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px;color:var(--tinta-2);white-space:nowrap}
.servicos a:hover{background:var(--verde-claro);color:var(--verde)}
.servicos svg{width:17px;height:17px;flex:none}
.barra-topo .busca{margin-left:auto;max-width:280px;min-width:214px}
.barra-topo .usuario{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--tinta-2);white-space:nowrap}
@media (max-width:1320px){.barra-dentro{flex-wrap:wrap;row-gap:6px}.servicos{order:5;width:100%;flex:auto;margin:0 -11px}}
@media (max-width:700px){.barra-topo{position:static}.barra-dentro{padding:10px 18px;gap:12px}.barra-topo .busca{order:6;max-width:none;width:100%;margin-left:0}.barra-topo .usuario{margin-left:auto}.barra-topo .usuario .nome{display:none}}
.demo{background:var(--ouro-claro);color:#6B4D10;padding:9px 36px;font-size:13px;border-bottom:1px solid #E8D8B0}
.conteudo{padding:28px 36px 64px;max-width:1280px}

/* ---------- blocos ---------- */
.cabeca{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.cabeca .acoes{display:flex;gap:8px;flex-wrap:wrap}
.painel{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);padding:20px 22px}
.painel + .painel,.grade + .painel,.painel + .grade,.numeros + .painel,.numeros + .grade{margin-top:18px}
.painel h2{margin-bottom:14px}
.grade{display:grid;gap:18px}
.grade > .painel,.grade > div > .painel:first-child{margin-top:0}
.g-2{grid-template-columns:1fr 1fr}
.g-ativo{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
.numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--linha);border-radius:var(--r);background:var(--branco)}
.numeros > div{padding:14px 18px;border-right:1px solid var(--linha-2)}
.numeros > div:last-child{border-right:none}
.numeros > div > span{display:block;font-size:13px;color:var(--tinta-2)}
.numeros strong{display:block;font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.numeros small{font-size:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--linha-2);white-space:nowrap}
th{font-size:12.5px;font-weight:600;color:var(--tinta-2);background:var(--branco);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
td.esq,th.esq{text-align:left}
tbody tr:hover{background:#F8FAF9}
th.ordena{cursor:pointer;user-select:none}
th.ordena:hover{color:var(--tinta)}
th.ordena[aria-sort=descending]::after{content:" ▾"} th.ordena[aria-sort=ascending]::after{content:" ▴"}
.tk{font-weight:700;text-decoration:none}
.tk:hover{color:var(--verde)}
.tk + small{display:block;color:var(--tinta-3);font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.rolagem{overflow:auto;max-height:640px;border:1px solid var(--linha);border-radius:var(--r);background:var(--branco)}
.vazio{padding:36px;text-align:center;color:var(--tinta-2)}
.vazio h3{margin-bottom:6px;color:var(--tinta)}
.vazio .acoes{margin-top:14px;display:flex;gap:8px;justify-content:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--linha);background:var(--branco);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:550}
.chip[aria-pressed=true]{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.abas{display:flex;gap:4px;border-bottom:1px solid var(--linha);margin-bottom:18px}
.abas button{border:none;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--tinta-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.abas button[aria-selected=true]{color:var(--tinta);border-bottom-color:var(--verde)}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0 18px}
.faixa{display:flex;gap:6px}
.selo{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--linha-2);color:var(--tinta-2)}
.selo.fii{background:var(--ouro-claro);color:#7A5710}

/* ---------- ativo ---------- */
.ativo-cab h1{font-size:44px;font-weight:800;font-stretch:112%;letter-spacing:-.02em}
.ativo-cab .preco{font-size:34px;font-weight:700;letter-spacing:-.01em;text-align:right}
.periodos{display:flex;gap:4px}
.periodos button{border:none;background:none;padding:5px 10px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--tinta-2);font-size:13px}
.periodos button[aria-pressed=true]{background:var(--tinta);color:#fff}
.grafico{position:relative}
.grafico svg{display:block;width:100%}
.dica{position:absolute;pointer-events:none;background:var(--tinta);color:#fff;font-size:12.5px;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-115%)}
.ind-grupo{margin-bottom:6px}
.ind-grupo h3{margin:14px 0 4px;font-size:13.5px;color:var(--tinta-2)}
.ind-grupo:first-child h3{margin-top:0}
.ind-linha{display:grid;grid-template-columns:1fr 90px 120px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--linha-2);font-size:14px}
.ind-linha strong{text-align:right;font-weight:650}
.ind-linha .cmp{text-align:right;font-size:12.5px;color:var(--tinta-3)}
.valor-justo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.valor-justo div{border:1px solid var(--linha-2);border-radius:8px;padding:12px}
.valor-justo span{font-size:13px;color:var(--tinta-2);display:block}
.valor-justo strong{font-size:22px;display:block;margin:2px 0}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--linha-2);font-size:14px}
.checklist li:last-child{border-bottom:none}
.checklist i{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;margin-top:1px}
.checklist .sim i{background:var(--verde-claro);color:var(--verde)}
.checklist .nao i{background:var(--queda-claro);color:var(--queda)}
.placar{font-size:13px;color:var(--tinta-2);margin:-8px 0 10px}
.placar b{font-size:18px;color:var(--tinta)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.info div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--linha-2);font-size:14px}
.info span{color:var(--tinta-2)}

/* ---------- carteira ---------- */
.lista-carteiras{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.lista-carteiras button{text-align:left;border:1px solid var(--linha);background:var(--branco);border-radius:var(--r);padding:18px;cursor:pointer}
.lista-carteiras button:hover{border-color:var(--verde)}
.lista-carteiras strong{font-size:18px;display:block;margin-bottom:4px}
/* análise */
.analise-ativos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.analise-ativos button{border:1px solid var(--linha);background:var(--branco);border-radius:999px;padding:6px 14px;font-weight:650;cursor:pointer}
.analise-ativos button[aria-pressed=true]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.analise-ativos input{max-width:200px;border-radius:999px}
.analise-painel{padding:16px 16px 10px}
.analise-barra{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.analise-titulo{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.analise-titulo .tk{font-size:22px;font-weight:800}
.analise-titulo span{color:var(--tinta-3);font-size:13.5px}
.analise-titulo strong{font-size:20px}
.analise-titulo em{font-style:normal;font-weight:700}
.analise-controles{display:flex;gap:10px;flex-wrap:wrap}
.segmentos{display:inline-flex;border:1px solid var(--linha);border-radius:8px;overflow:hidden;background:var(--branco)}
.segmentos button{border:none;background:none;padding:6px 11px;font-size:13.5px;font-weight:600;color:var(--tinta-2);cursor:pointer}
.segmentos button+button{border-left:1px solid var(--linha-2)}
.segmentos button[aria-pressed=true]{background:var(--verde-claro);color:var(--verde)}
.analise-ind{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip-check{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px 4px 8px;border:1px solid var(--linha-2);border-radius:999px;cursor:pointer;color:var(--tinta-2)}
.chip-check input{accent-color:var(--cor,var(--verde));margin:0}
.chip-check:has(input:checked){border-color:var(--cor,var(--verde));color:var(--tinta)}
.velas-caixa{position:relative;height:clamp(380px,62vh,620px);user-select:none}
.velas-caixa canvas{display:block;cursor:crosshair;touch-action:none}
.velas-legenda{position:absolute;left:8px;top:6px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--tinta-2);pointer-events:none;
  background:rgba(255,255,255,.86);padding:4px 8px;border-radius:6px;max-width:calc(100% - 90px)}
.velas-legenda b{color:var(--tinta)}
.link-analise{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:650;color:var(--verde);text-decoration:none}
.link-analise svg,.ir-grafico svg{width:17px;height:17px}
/* preço teto */
.painel.teto{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;border-color:#E8D8B0;background:linear-gradient(90deg,var(--ouro-claro),var(--branco) 70%)}
.painel.teto .rotulo{font-size:13px;color:var(--tinta-2)}
.painel.teto strong{display:block;font-size:30px;font-weight:800;margin:2px 0}
.painel.teto p{margin:0;color:var(--tinta-2)}
.margem span{display:flex;align-items:center;gap:6px}
.margem input{width:80px}
.celula-teto small{display:block;font-size:11.5px;font-weight:650}
/* seletor de carteiras mais rico */
.cc-valor{display:block;font-size:24px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.cc-dia{display:block;font-size:13.5px;font-weight:650}
.cc-spark{display:block;height:44px;margin:10px 0 8px}
.cc-spark svg{width:100%;height:44px}
.cc-dados{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--linha-2);padding-top:10px}
.cc-dados small{display:block;font-size:11.5px;color:var(--tinta-3)}
.cc-dados b{font-size:14.5px}
.g-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mercado-lista{padding:16px 18px}
.mercado-lista h3{margin-bottom:8px}
.mercado-lista ol{list-style:none;margin:0;padding:0}
.mercado-lista li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--linha-2)}
.mercado-lista li:first-child{border-top:none}
.mercado-ativo{text-decoration:none;min-width:0}
.mercado-ativo b{display:block}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
/* =====================================================================
   Milhão — versão 1 (custo zero)
   Lê os dados gerados pelo robô em data/ e guarda as carteiras no navegador.
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const CHAVE = "milhao:v1";
const S = { ativos: [], porTicker: {}, meta: null, det: {}, estado: null, memoria: null };

/* ---------- formatação ---------- */
const nf = (c) => new Intl.NumberFormat("pt-BR", { minimumFractionDigits: c, maximumFractionDigits: c });
const F = { n0: nf(0), n1: nf(1), n2: nf(2) };
const vazio = (v) => v === null || v === undefined || Number.isNaN(v);
const brl = (v, c = 2) => vazio(v) ? "–" : (v < 0 ? "-R$ " : "R$ ") + nf(c).format(Math.abs(v));
const pct = (v, c = 1, sinal = false) => vazio(v) ? "–" : (sinal && v > 0 ? "+" : "") + nf(c).format(v * 100) + "%";
const qtdF = (v) => Number.isInteger(v) ? F.n0.format(v) : nf(0).format(Math.trunc(v)) + "," + String(Math.round((v % 1) * 1e6)).padStart(6, "0").replace(/0+$/, "");
const xv = (v, c = 2) => vazio(v) ? "–" : nf(c).format(v);
function compacto(v) {
  if (vazio(v)) return "–";
  const a = Math.abs(v);
  const sinal = v < 0 ? "-R$ " : "R$ ";
  if (a >= 1e12) return sinal + F.n2.format(a / 1e12) + " tri";
  if (a >= 1e9) return sinal + F.n1.format(a / 1e9) + " bi";
  if (a >= 1e6) return sinal + F.n1.format(a / 1e6) + " mi";
  if (a >= 1e3) return sinal + F.n1.format(a / 1e3) + " mil";
  return brl(v);
}
const cls = (v) => vazio(v) || v === 0 ? "" : v > 0 ? "alta" : "baixa";
const dataBR = (iso) => iso ? iso.slice(8, 10) + "/" + iso.slice(5, 7) + "/" + iso.slice(0, 4) : "–";
const hojeISO = () => new Date().toISOString().slice(0, 10);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtInd = (v, f) => f === "%" ? pct(v) : f === "r$" ? brl(v) : xv(v);
function aviso(msg, acao = null) {
  // acao opcional: { rotulo, fn } vira um botão no aviso (ex.: "Desfazer"), que fica mais tempo na tela
  const el = $("#aviso"); el.textContent = msg; el.classList.remove("oculto");
  if (acao) {
    const b = document.createElement("button"); b.type = "button"; b.className = "aviso-acao"; b.textContent = acao.rotulo;
    b.onclick = () => { el.classList.add("oculto"); acao.fn(); };
    el.append(b);
  }
  clearTimeout(aviso.t); aviso.t = setTimeout(() => el.classList.add("oculto"), acao ? 8000 : 2600);
}

function perguntar({ titulo, texto = "", rotulo = "", valor = null, botao = "Confirmar", perigo = false }) {
  const dlg = $("#dlg-pergunta"), campo = $("#pergunta-campo");
  $("#pergunta-titulo").textContent = titulo; $("#pergunta-texto").textContent = texto;
  $("#pergunta-ok").textContent = botao;
  $("#pergunta-ok").classList.toggle("excluir", perigo);
  const comCampo = valor !== null;
  $("#pergunta-campo-rotulo").classList.toggle("oculto", !comCampo);
  $("#pergunta-rotulo").textContent = rotulo; campo.value = valor ?? ""; campo.required = comCampo;
  dlg.returnValue = ""; dlg.showModal(); if (comCampo) campo.select();
  if (perigo) dlg.querySelector('button[value="cancelar"]').focus(); // num clique sem querer no Enter, nada é apagado
  return new Promise((ok) => { dlg.onclose = () => ok(dlg.returnValue === "ok" ? (comCampo ? campo.value.trim() : true) : null); });
}

/* ---------- contas e nuvem (Supabase, plano gratuito) ----------
   A chave abaixo é a chave pública do projeto: ela só abre o que as regras do banco permitem
   (cada pessoa lê e grava apenas a própria linha). Sem ela preenchida, o Milhão funciona só no navegador. */
const NUVEM = { url: "https://gyxftcpycrnjryfwpslt.supabase.co", chave: "sb_publishable_TgiTzZYWxVaPZ0H6S17d1g_4-rAnuWG" };
const SITE = location.origin + location.pathname;
S.nuvem = null; S.usuario = null;
function iniciarNuvem() {
  if (!NUVEM.url || !NUVEM.chave || !window.supabase?.createClient) return null;
  return window.supabase.createClient(NUVEM.url, NUVEM.chave, { auth: { flowType: "pkce", persistSession: true, detectSessionInUrl: true } });
}
const nomeDoUsuario = (u) => (u?.user_metadata?.nome || u?.email?.split("@")[0] || "Investidor").trim();

/* ---------- estado salvo no navegador ---------- */
function carregarEstado() {
  try { const s = JSON.parse(localStorage.getItem(CHAVE)); if (s) return s; } catch (e) { /* sem storage */ }
  return S.memoria || { perfil: null, carteiras: [], ativa: null };
}
function salvar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(S.estado)); } catch (e) { S.memoria = S.estado; }
  if (S.nuvem && S.usuario) { clearTimeout(salvar.t); salvar.t = setTimeout(enviarNuvem, 700); }
}
async function enviarNuvem() {
  const { error } = await S.nuvem.from("perfis").upsert({
    id: S.usuario.id, nome: S.estado.perfil?.nome || nomeDoUsuario(S.usuario), estado: S.estado, atualizado_em: new Date().toISOString(),
  });
  if (error) { aviso("Não deu para salvar na nuvem. Suas mudanças estão guardadas aqui e vão de novo na próxima alteração."); console.warn(error); }
}
/* depois de entrar: a carteira da nuvem vale; se a nuvem estiver vazia, sobe o que já existia neste navegador */
async function abrirConta(usuario) {
  S.usuario = usuario;
  const perfil = { nome: nomeDoUsuario(usuario), email: usuario.email };
  const { data, error } = await S.nuvem.from("perfis").select("estado").eq("id", usuario.id).maybeSingle();
  if (error) { aviso("Não deu para buscar suas carteiras na nuvem agora. Tente recarregar a página."); console.warn(error); }
  const local = carregarEstado();
  if (data?.estado?.carteiras) {
    S.estado = { ...data.estado, perfil };
  } else {
    const temLocal = local.carteiras?.some((c) => c.lancamentos?.length);
    S.estado = { carteiras: temLocal ? local.carteiras : [], ativa: temLocal ? local.ativa : null, perfil };
    if (!error) { await enviarNuvem(); if (temLocal) aviso("Trouxemos para a sua conta as carteiras que estavam neste navegador"); }
  }
  try { localStorage.setItem(CHAVE, JSON.stringify(S.estado)); } catch (e) { /* sem storage */ }
}
async function sairDaConta() {
  if (S.nuvem) await S.nuvem.auth.signOut();
  S.usuario = null; S.estado = { perfil: null, carteiras: [], ativa: null };
  try { localStorage.removeItem(CHAVE); } catch (e) { /* sem storage */ }
  ir("#entrada");
}
const carteira = () => S.estado.carteiras.find((c) => c.id === S.estado.ativa) || null;
const novoId = () => Math.random().toString(36).slice(2, 10);

/* ---------- dados ---------- */
async function j(url) {
  // versão de arquivo único: os dados vêm embutidos na própria página
  if (window.MILHAO_DADOS && url in window.MILHAO_DADOS) return structuredClone(window.MILHAO_DADOS[url]);
  const r = await fetch(url, { cache: "no-cache" });
  if (!r.ok) throw new Error(url + " respondeu " + r.status);
  return r.json();
}
async function detalhe(t) {
  if (!S.det[t]) S.det[t] = await j(`data/ativo/${encodeURIComponent(t)}.json`);
  return S.det[t];
}
const precoAtual = (t) => S.porTicker[t]?.preco ?? null;

/* ---------- carteira: contas ---------- */
/* tipos de lançamento: C compra, V venda, B entrada sem compra (desdobro, bonificação),
   G saída sem venda (grupamento, fração) — B e G mexem na quantidade e mantêm o custo */
const ORDEM_TIPO = { B: 0, G: 1, C: 2, V: 3 };
const sinalQtd = (l) => (l.tipo === "C" || l.tipo === "B" ? 1 : -1);
const NOME_TIPO = { C: "Compra", V: "Venda", B: "Entrada de ações", G: "Saída de ações" };
const nomeLanc = (l) => l.evento || NOME_TIPO[l.tipo] || l.tipo;
function ordenados(c) {
  return [...c.lancamentos].sort((a, b) => a.data.localeCompare(b.data) || (ORDEM_TIPO[a.tipo] ?? 9) - (ORDEM_TIPO[b.tipo] ?? 9));
}
function posicoes(c) {
  const m = {};
  for (const l of ordenados(c)) {
    const p = m[l.ticker] ??= { ticker: l.ticker, qtd: 0, custo: 0, realizado: 0 };
    if (l.tipo === "C" || l.tipo === "B") { p.custo += l.qtd * (l.preco || 0); p.qtd += l.qtd; }
    else if (l.tipo === "G") { p.qtd = Math.max(p.qtd - l.qtd, 0); if (!p.qtd) p.custo = 0; }
    else {
      const pm = p.qtd ? p.custo / p.qtd : 0, q = Math.min(l.qtd, p.qtd);
      p.realizado += q * (l.preco - pm); p.custo -= q * pm; p.qtd -= q;
    }
  }
  return Object.values(m).map((p) => {
    p.qtd = Math.round(p.qtd * 1e6) / 1e6;
    const preco = precoAtual(p.ticker);
    const valor = preco !== null ? p.qtd * preco : null;
    return { ...p, pm: p.qtd ? p.custo / p.qtd : 0, preco, valor, resultado: valor !== null ? valor - p.custo : null };
  });
}
function qtdEm(c, t, data) {
  let q = 0;
  for (const l of c.lancamentos) if (l.ticker === t && l.data <= data) q += sinalQtd(l) * l.qtd;
  return Math.max(q, 0);
}
async function proventosDaCarteira(c) {
  const tickers = [...new Set(c.lancamentos.map((l) => l.ticker))].filter((t) => S.porTicker[t]);
  const primeira = ordenados(c)[0]?.data || hojeISO();
  const out = [];
  await Promise.all(tickers.map(async (t) => {
    let d; try { d = await detalhe(t); } catch (e) { return; }
    for (const p of d.proventos || []) {
      if (!p.data_com || p.data_com < primeira) continue;
      const q = qtdEm(c, t, p.data_com);
      if (q > 0) out.push({ ...p, ticker: t, qtd: q, total: q * p.valor,
        recebido: !!p.pagamento && p.pagamento <= hojeISO() });
    }
  }));
  return out.sort((a, b) => (b.pagamento || b.data_com).localeCompare(a.pagamento || a.data_com));
}
async function evolucao(c) {
  const lanc = ordenados(c);
  if (!lanc.length) return [];
  const tickers = [...new Set(lanc.map((l) => l.ticker))].filter((t) => S.porTicker[t]);
  const series = {};
  await Promise.all(tickers.map(async (t) => { try { series[t] = (await detalhe(t)).precos; } catch (e) { /* ignora */ } }));
  const ini = lanc[0].data;
  const datas = [...new Set(Object.values(series).flatMap((s) => s.map((p) => p[0])))].filter((d) => d >= ini).sort();
  const idx = Object.fromEntries(tickers.map((t) => [t, 0]));
  const ultimo = {};
  return datas.map((d) => {
    let total = 0, custo = 0;
    for (const t of tickers) {
      const s = series[t]; if (!s) continue;
      while (idx[t] < s.length && s[idx[t]][0] <= d) { ultimo[t] = s[idx[t]][1]; idx[t]++; }
      const q = qtdEm(c, t, d);

      <span>Fechamento <b>${fmtP(v.c)}</b></span><span class="${cls(varr)}">${pct(varr, 2, true)}</span><span>Volume <b>${compacto(v.v)}</b></span>
      ${calc.ifr && calc.ifr[i] !== null ? `<span style="color:#A97A1C">IFR ${xv(calc.ifr[i], 0)}</span>` : ""}${mms}`;
  }
  // zoom com a roda do mouse, arrastar para os lados, duplo clique volta ao período
  cv.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, esc = g._esc; if (!esc) return;
    const ancora = g.ini + x / esc.esp, f = e.deltaY > 0 ? 1.15 : 1 / 1.15;
    let vis = Math.min(Math.max((g.fim - g.ini) * f, 12), g.velas.length + 10);
    g.ini = ancora - (x / esc.pw) * vis; g.fim = g.ini + vis; limitar(); desenhar();
  }, { passive: false });
  let arrasto = null;
  cv.addEventListener("pointerdown", (e) => { arrasto = { x: e.clientX, ini: g.ini, fim: g.fim }; cv.setPointerCapture(e.pointerId); cv.style.cursor = "grabbing"; });
  cv.addEventListener("pointermove", (e) => {
    const r = cv.getBoundingClientRect();
    g.mouse = { x: e.clientX - r.left, y: e.clientY - r.top };
    if (arrasto && g._esc) {
      const d = (e.clientX - arrasto.x) / g._esc.esp;
      g.ini = arrasto.ini - d; g.fim = arrasto.fim - d; limitar();
    }
    desenhar();
  });
  const soltar = () => { arrasto = null; cv.style.cursor = "crosshair"; };
  cv.addEventListener("pointerup", soltar); cv.addEventListener("pointercancel", soltar);
  cv.addEventListener("pointerleave", () => { if (!arrasto) { g.mouse = null; desenhar(); } });
  cv.addEventListener("dblclick", () => g.aoDuploClique?.());
  function limitar() {
    const N = g.velas.length, vis = g.fim - g.ini;
    if (g.ini < -2) { g.ini = -2; g.fim = g.ini + vis; }
    if (g.fim > N + 8) { g.fim = N + 8; g.ini = g.fim - vis; }
  }
  new ResizeObserver(() => desenhar()).observe(caixa);
  g.desenhar = desenhar;
  return g;
}

/* ---------- tela de entrada: arte da esquerda ---------- */
function velasEntrada() {
  // série sorteada com semente fixa: sobe no geral, com quedas no caminho
  let s = 7, preco = 40;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const velas = Array.from({ length: 46 }, (_, i) => {
    const abre = preco, tendencia = 0.9 + i * 0.012;
    const fecha = Math.max(8, abre + (rnd() - 0.42) * 6 * tendencia);
    const max = Math.max(abre, fecha) + rnd() * 3, min = Math.min(abre, fecha) - rnd() * 3;
    preco = fecha;
    return { abre, fecha, max, min };
  });
  const topo = Math.max(...velas.map((v) => v.max)), base = Math.min(...velas.map((v) => v.min));
  const Y = (v) => 6 + (topo - v) / (topo - base) * 188, L = 1000 / velas.length;
  return `<svg class="velas" viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true">${velas.map((v, i) => {
    const sobe = v.fecha >= v.abre, cor = sobe ? "#2FCB8F" : "#E46A55", x = i * L + L / 2;
    const y1 = Y(Math.max(v.abre, v.fecha)), y2 = Y(Math.min(v.abre, v.fecha));
    return `<g class="vela" style="--i:${i}" fill="${cor}" stroke="${cor}">
      <line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${Y(v.max).toFixed(1)}" y2="${Y(v.min).toFixed(1)}" stroke-width="2" vector-effect="non-scaling-stroke"/>
      <rect x="${(x - L * 0.32).toFixed(1)}" y="${y1.toFixed(1)}" width="${(L * 0.64).toFixed(1)}" height="${Math.max(y2 - y1, 1.5).toFixed(1)}" rx="1.5" ${sobe ? "" : 'fill-opacity=".85"'}/></g>`;
  }).join("")}</svg>`;
}
function telaoEntrada() {
  // painel gigante de cotações ao fundo, feito com os ativos mais negociados de verdade
  const base = (S.ativos || []).filter((a) => a.preco).slice(0, 112);

  const cel = (a) => `<div><b>${esc(a.t)}</b><span>${brl(a.preco)}</span><em class="${(a.var_dia || 0) >= 0 ? "sobe" : "desce"}">${pct(a.var_dia, 2, true)}</em></div>`;

  return `<div class="telao" aria-hidden="true"><div class="telao-rolo"><div class="telao-grade">${grade}</div><div class="telao-grade">${grade}</div></div></div>`;
}

/* lupa: ao passar o cursor, um círculo amplia o pedaço da marca que está embaixo dele */
function ligarLupa() {
  const area = $("#lupa-area"), lupa = $("#lupa");
  if (!area || !lupa || area.dataset.ligada) return;
  area.dataset.ligada = "1";
  const ZOOM = 2.2, conteudo = lupa.firstElementChild;
  const mover = (e) => {
    const r = area.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, R = lupa.offsetWidth / 2;
    lupa.style.transform = `translate(${x - R}px, ${y - R}px)`;
    conteudo.style.transform = `translate(${R - x * ZOOM}px, ${R - y * ZOOM}px) scale(${ZOOM})`;
  };
  area.addEventListener("pointerenter", (e) => { mover(e); area.classList.add("com-lupa"); });
  area.addEventListener("pointermove", mover);
  area.addEventListener("pointerleave", () => area.classList.remove("com-lupa"));
}

        ${modo === "entrar" ? `<a href="#" data-modo="esqueci" class="esqueci">Esqueci minha senha</a>` : ""}
        <p class="erro-login oculto" id="erro-login" role="alert"></p>
        <button class="btn primario" type="submit">${textos.botao}</button>
        ${textos.troca ? `<p class="sutil" style="margin:0;text-align:center">${textos.troca}</p>` : ""}

      </form>`;
  if (ja) $("#entrada-form").innerHTML = formulario;
  else $("#raiz").innerHTML = `<main class="entrada">${arteEntrada()}<section class="entrada-form" id="entrada-form">${formulario}</section></main>`;
  ligarLupa();
  $$("[data-modo]").forEach((a) => a.onclick = (e) => { e.preventDefault(); telaLogin(curva, a.dataset.modo); });
  const form = $("#form-login"), botao = form.querySelector("button[type=submit]");
  const erro = (msg) => { const el = $("#erro-login"); el.textContent = msg; el.classList.toggle("oculto", !msg); };
  form.querySelector("input")?.focus();
  form.addEventListener("submit", async (e) => {
    e.preventDefault(); erro("");
    const f = new FormData(form), email = String(f.get("email") || "").trim(), senha = String(f.get("senha") || "");
    if (modo === "criar" && !String(f.get("nome") || "").trim()) return erro("Conte como você quer ser chamado.");
    if (modo !== "nova" && !/^\S+@\S+\.\S+$/.test(email)) return erro("Confira o e-mail: falta alguma coisa nele.");

      if (modo === "esqueci") r = await a.resetPasswordForEmail(email, { redirectTo: SITE });

/* ---------- excluir carteira (com confirmação e "Desfazer") ---------- */
async function excluirCarteira(id) {
  const lista = S.estado.carteiras, i = lista.findIndex((c) => c.id === id);
  if (i < 0) return false;
  const c = lista[i], n = c.lancamentos.length;
  const ok = await perguntar({
    titulo: `Excluir a carteira "${c.nome}"?`,
    texto: n ? `${plural(n, "lançamento vai junto", "lançamentos vão junto")} com ela. Se foi sem querer, dá para desfazer logo depois.` : "Ela ainda está vazia.",
    botao: "Excluir carteira", perigo: true,
  });
  if (!ok) return false;
  const eraAtiva = S.estado.ativa === id;
  lista.splice(i, 1);
  if (eraAtiva) S.estado.ativa = null;
  salvar();
  aviso(`Carteira "${c.nome}" excluída`, { rotulo: "Desfazer", fn: () => {
    S.estado.carteiras.splice(Math.min(i, S.estado.carteiras.length), 0, c);
    if (eraAtiva) S.estado.ativa = c.id;
    salvar(); aviso(`Carteira "${c.nome}" de volta`); render();
  } });
  return true;
}

function ligarBusca() {
  const inp = $("#busca"), box = $("#sugestoes");

    if (!q) { box.classList.add("oculto"); return; }
    res = S.ativos.filter((a) => a.t.startsWith(q)).concat(S.ativos.filter((a) => !a.t.startsWith(q) && (a.t.includes(q) || (a.n || "").toUpperCase().includes(q)))).slice(0, 8);

/* ---------- importação: planilhas da Área do Investidor da B3 (.xlsx) ou CSV ---------- */
async function lerZip(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= 0; i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("o arquivo não é uma planilha .xlsx");
  const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const arquivos = {};
  for (let k = 0; k < n; k++) {
    const metodo = dv.getUint16(p + 10, true), tam = dv.getUint32(p + 20, true);
    const ln = dv.getUint16(p + 28, true), le = dv.getUint16(p + 30, true), lc = dv.getUint16(p + 32, true);
    const off = dv.getUint32(p + 42, true);
    const nome = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + ln));
    arquivos[nome] = { metodo, tam, off };
    p += 46 + ln + le + lc;
  }
  const ler = async (nome) => {
    const a = arquivos[nome]; if (!a) return null;
    const ini = a.off + 30 + dv.getUint16(a.off + 26, true) + dv.getUint16(a.off + 28, true);
    const dados = u8.subarray(ini, ini + a.tam);
    if (a.metodo === 0) return new TextDecoder().decode(dados);
    const s = new Blob([dados]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return await new Response(s).text();
  };
  ler.nomes = Object.keys(arquivos);
  return ler;
}
/* devolve todas as abas: [{ nome, linhas: [[célula, ...], ...] }] */
async function abasXlsx(buf) {
  const ler = await lerZip(buf), dp = new DOMParser();
  const xmlDe = (t) => dp.parseFromString(t, "application/xml");
  const ss = await ler("xl/sharedStrings.xml");
  const textos = ss ? [...xmlDe(ss).getElementsByTagName("si")].map((si) =>
    [...si.getElementsByTagName("t")].map((t) => t.textContent).join("")) : [];
  // nomes das abas na ordem do arquivo
  let abas = [];
  const wb = await ler("xl/workbook.xml"), rels = await ler("xl/_rels/workbook.xml.rels");
  if (wb && rels) {
    const alvo = {};
    for (const r of xmlDe(rels).getElementsByTagName("Relationship")) alvo[r.getAttribute("Id")] = r.getAttribute("Target");
    abas = [...xmlDe(wb).getElementsByTagName("sheet")].map((s) => {
      const id = s.getAttribute("r:id") || s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
      const t = (alvo[id] || "").replace(/^\/?(xl\/)?/, "");
      return { nome: s.getAttribute("name"), arquivo: "xl/" + t };
    });
  }
  if (!abas.length) abas = ler.nomes.filter((n) => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()
    .map((a, i) => ({ nome: "Aba " + (i + 1), arquivo: a }));
  const out = [];
  for (const aba of abas) {
    const xml = await ler(aba.arquivo); if (!xml) continue;
    const linhas = [...xmlDe(xml).getElementsByTagName("row")].map((row) => {
      const cel = [];
      for (const c of row.getElementsByTagName("c")) {
        const ref = c.getAttribute("r") || "";
        const col = ref.replace(/\d+/g, "").split("").reduce((s, ch) => s * 26 + ch.charCodeAt(0) - 64, 0) - 1;
        const t = c.getAttribute("t");
        let v;
        if (t === "inlineStr") v = [...c.getElementsByTagName("t")].map((x) => x.textContent).join("");
        else v = c.getElementsByTagName("v")[0]?.textContent ?? "";
        cel[col >= 0 ? col : cel.length] = t === "s" ? textos[+v] : v;
      }
      return Array.from(cel, (x) => x ?? "");
    });
    out.push({ nome: aba.nome, linhas });
  }
  return out;
}
function linhasCsv(texto) {
  const prim = texto.split("\n")[0];
  const sep = (prim.match(/;/g) || []).length >= (prim.match(/,/g) || []).length ? ";" : ",";
  return texto.split(/\r?\n/).filter((l) => l.trim()).map((l) => l.split(sep).map((x) => x.replace(/^"|"$/g, "").trim()));
}
const semAcento = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
function numeroBR(v) {
  if (typeof v === "number") return v;
  const s = String(v ?? "").replace(/R\$|\s/g, "");
  if (!s || s === "-") return NaN;
  if (/^-?\d+(\.\d+)?(e-?\d+)?$/i.test(s)) return +s;
  return +s.replace(/\./g, "").replace(",", ".");
}
function dataImport(v) {
  const s = String(v ?? "").trim();
  if (/^\d{2}\/\d{2}\/\d{4}/.test(s)) return `${s.slice(6, 10)}-${s.slice(3, 5)}-${s.slice(0, 2)}`;
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  if (/^\d{5}(\.\d+)?$/.test(s)) return new Date(Date.UTC(1899, 11, 30) + Math.floor(+s) * 864e5).toISOString().slice(0, 10);
  return null;
}
/* "PETR4 - PETROLEO BRASILEIRO" / "PETR4F" / "petr4" → "PETR4"; renda fixa, Tesouro e direitos de subscrição → null */
function tickerDe(v) {
  const m = String(v ?? "").trim().toUpperCase().match(/^([A-Z]{4})(\d{1,2})F?(?=$|[\s-])/);
  if (!m) return null;
  if (["1", "2", "9", "10", "12", "13", "14", "15"].includes(m[2])) return null; // direitos e recibos de subscrição
  return m[1] + m[2];
}
function acharCabecalho(linhas) {
  for (let i = 0; i < Math.min(linhas.length, 30); i++) {
    const cab = linhas[i].map(semAcento);
    const tem = (...n) => n.some((x) => cab.some((c) => c.includes(x)));
    if (tem("codigo de negociacao", "produto", "ticker", "ativo") && tem("quantidade", "qtd")) return { i, cab };
  }
  return null;
}
const PROVENTO = /dividendo|juros sobre capital|rendimento|reembolso|leilao de fracao|amortizacao|restituicao|premio|pagamento de juros/;
const LANC_MOV = [ // movimentação da B3 → lançamento do Milhão
  [/liquidacao|^compra$|^venda$/, (cred) => (cred ? "C" : "V"), null],
  [/desdobr/, (cred) => (cred ? "B" : null), "Desdobramento"],
  [/bonificacao/, (cred) => (cred ? "B" : null), "Bonificação"],
  [/grupamento/, (cred) => (cred ? "B" : "G"), "Grupamento"],
  [/fracao em ativos/, (cred) => (cred ? null : "G"), "Fração vendida em leilão"],
];
/* lê uma aba e devolve o que dá para aproveitar dela */
function interpretarAba(linhas, nomeAba) {
  const h = acharCabecalho(linhas);
  if (!h) return null;
  const { i, cab } = h;
  const col = (...nomes) => { for (const n of nomes) { const k = cab.findIndex((c) => c.includes(n)); if (k >= 0) return k; } return -1; };
  const corpo = linhas.slice(i + 1).filter((l) => l.some((x) => String(x).trim()));
  const r = { tipo: "generico", aba: nomeAba, lancs: [], posicao: [], proventos: 0, foraBolsa: 0, outros: {} };
  const outro = (nome) => { r.outros[nome] = (r.outros[nome] || 0) + 1; };

  if (col("entrada/saida") >= 0) { // planilha de Movimentação
    r.tipo = "movimentacao";
    const cES = col("entrada/saida"), cData = col("data"), cMov = col("movimentacao"), cProd = col("produto");
    const cQtd = col("quantidade"), cPreco = col("preco");
    for (const l of corpo) {
      const mov = semAcento(l[cMov]), cred = /credito|entrada/.test(semAcento(l[cES]));
      const t = tickerDe(l[cProd]);
      if (PROVENTO.test(mov)) { r.proventos++; continue; }
      if (!t) { r.foraBolsa++; continue; }
      const regra = LANC_MOV.find(([re]) => re.test(mov));
      const tipo = regra ? regra[1](cred) : null;
      if (!tipo) { outro(String(l[cMov]).trim() || "Sem nome"); continue; }
      const preco = numeroBR(l[cPreco]);
      const q = Math.abs(numeroBR(l[cQtd]));
      // frações (desdobro, leilão de fração) ficam com casas decimais; compra e venda são sempre inteiras
      const lanc = { id: novoId(), ticker: t, tipo, data: dataImport(l[cData]), qtd: tipo === "B" || tipo === "G" ? Math.round(q * 1e6) / 1e6 : Math.round(q),
        preco: tipo === "G" ? 0 : (Number.isFinite(preco) && (tipo === "C" || tipo === "V" || regra[2] === "Bonificação") ? preco : 0),
        origem: "b3-movimentacao" };
      if (regra[2]) lanc.evento = regra[2];
      if (lanc.data && lanc.qtd > 0) r.lancs.push(lanc); else outro("Linha sem data ou quantidade");
    }
    return r;
  }
  if (col("quantidade disponivel", "valor atualizado", "preco de fechamento") >= 0) { // planilha de Posição
    r.tipo = "posicao";
    const cTk = col("codigo de negociacao"), cProd = col("produto"), cQtd = col("quantidade");
    const cPreco = col("preco de fechamento", "preco");
    for (const l of corpo) {
      const t = tickerDe(cTk >= 0 && l[cTk] ? l[cTk] : l[cProd]);
      const qtd = Math.round(numeroBR(l[cQtd]));
      if (!t) { if (String(l[cProd] ?? "").trim() && !/^total/i.test(String(l[cProd]))) r.foraBolsa++; continue; }
      if (!(qtd > 0)) continue;
      const preco = numeroBR(l[cPreco]);
      r.posicao.push({ ticker: t, qtd, preco: Number.isFinite(preco) ? preco : (precoAtual(t) ?? 0) });
    }
    return r;
  }
  // planilha de Negociação ou CSV simples (data; ativo; operação; quantidade; preço)
  r.tipo = col("data do negocio") >= 0 || (col("tipo de movimentacao") >= 0 && col("codigo de negociacao") >= 0) ? "negociacao" : "generico";
  const cData = col("data do negocio", "data"), cTk = col("codigo de negociacao", "ticker", "ativo", "produto");
  const cTipo = col("tipo de movimentacao", "operacao", "c/v", "tipo"), cQtd = col("quantidade", "qtd"), cPreco = col("preco");
  for (const l of corpo) {
    const t = tickerDe(l[cTk]);
    if (!t) { if (String(l[cTk] ?? "").trim()) r.foraBolsa++; continue; }
    const tipoTxt = semAcento(cTipo >= 0 ? l[cTipo] : "c");
    const lanc = { id: novoId(), ticker: t, tipo: /venda|^v$/.test(tipoTxt) ? "V" : "C", data: dataImport(l[cData]),
      qtd: Math.round(Math.abs(numeroBR(l[cQtd]))), preco: numeroBR(l[cPreco]),
      origem: r.tipo === "negociacao" ? "b3-negociacao" : "planilha" };
    if (lanc.data && lanc.qtd > 0 && lanc.preco >= 0) r.lancs.push(lanc); else outro("Linha sem data, quantidade ou preço");
  }
  return r;
}
/* junta todas as abas de todos os arquivos escolhidos */
async function lerArquivosImportacao(arquivos) {
  const tudo = { tipos: new Set(), lancs: [], posicao: {}, proventos: 0, foraBolsa: 0, outros: {}, arquivos: [] };
  for (const arq of arquivos) {
    const abas = /\.xlsx$/i.test(arq.name) ? await abasXlsx(await arq.arrayBuffer())
      : [{ nome: arq.name, linhas: linhasCsv(await arq.text()) }];
    let usou = false;
    for (const aba of abas) {
      const r = interpretarAba(aba.linhas, aba.nome);
      if (!r) continue;
      usou = true; tudo.tipos.add(r.tipo);
      for (const l of r.lancs) l.arq = tudo.arquivos.length;
      tudo.lancs.push(...r.lancs); tudo.proventos += r.proventos; tudo.foraBolsa += r.foraBolsa;
      for (const [k, v] of Object.entries(r.outros)) tudo.outros[k] = (tudo.outros[k] || 0) + v;
      for (const p of r.posicao) { // a mesma ação em duas corretoras vira uma linha só
        const q = tudo.posicao[p.ticker] ??= { ticker: p.ticker, qtd: 0, preco: p.preco };
        q.qtd += p.qtd;
      }
    }
    tudo.arquivos.push({ nome: arq.name, usou });
  }
  if (!tudo.arquivos.some((a) => a.usou))
    throw new Error("não reconheci a planilha. Use as planilhas de Negociação, Movimentação ou Posição da Área do Investidor da B3, ou um CSV com data; ativo; operação; quantidade; preço");
  tudo.posicao = Object.values(tudo.posicao).sort((a, b) => a.ticker.localeCompare(b.ticker));
  return tudo;
}

function previaImportacao(tudo) {
  const c = carteira(), dlg = $("#dlg-importar");
  const temNeg = c.lancamentos.some((l) => l.origem === "b3-negociacao") || tudo.lancs.some((l) => l.origem === "b3-negociacao");
  const movTrocavel = c.lancamentos.filter((l) => l.origem === "b3-movimentacao" && (l.tipo === "C" || l.tipo === "V"));
  // Negociação e Movimentação trazem as mesmas compras (uma na data do pregão, outra na liquidação):
  // quando há Negociação, da Movimentação só entram os eventos
  let novos = tudo.lancs.filter((l) => !(temNeg && l.origem === "b3-movimentacao" && (l.tipo === "C" || l.tipo === "V")));
  const pulados = tudo.lancs.length - novos.length;
  // duas operações iguais no mesmo dia são reais e entram as duas; o que se repete entre arquivos
  // (períodos que se sobrepõem) ou que já está na carteira entra uma vez só
  const noArq = new Map(), precisa = new Map(), tem = new Map();
  for (const l of novos) { const k = chaveLanc(l) + "#" + l.arq; noArq.set(k, (noArq.get(k) || 0) + 1); }
  for (const [k, n] of noArq) { const base = k.split("#")[0]; precisa.set(base, Math.max(precisa.get(base) || 0, n)); }
  for (const l of c.lancamentos) tem.set(chaveLanc(l), (tem.get(chaveLanc(l)) || 0) + 1);
  const entra = [];
  for (const l of novos) {
    const k = chaveLanc(l), falta = (precisa.get(k) || 0) - (tem.get(k) || 0);
    if (falta > 0) { entra.push(l); tem.set(k, (tem.get(k) || 0) + 1); }
  }
  novos = entra.map(({ arq, ...l }) => l);
  const repetidos = tudo.lancs.length - pulados - novos.length;
  const conta = (f) => novos.filter(f).length;
  const nC = conta((l) => l.tipo === "C"), nV = conta((l) => l.tipo === "V"), nE = conta((l) => l.tipo === "B" || l.tipo === "G");

  // Posição: entra só o que a carteira ainda não tem
  const atual = Object.fromEntries(posicoes(c).map((p) => [p.ticker, p.qtd]));
  const posNovas = tudo.posicao.filter((p) => !atual[p.ticker] && !novos.some((l) => l.ticker === p.ticker));
  const posDif = tudo.posicao.filter((p) => atual[p.ticker] && atual[p.ticker] !== p.qtd);

  const itens = [];
  if (nC) itens.push(["Compras", nC]); if (nV) itens.push(["Vendas", nV]);
  if (nE) itens.push(["Desdobramentos, bonificações e grupamentos", nE]);
  if (posNovas.length) itens.push(["Ativos da planilha de posição", posNovas.length]);
  const fora = [];
  if (repetidos > 0) fora.push(["Repetidos (já na carteira ou em mais de um arquivo)", repetidos]);
  if (pulados) fora.push(["Compras e vendas da Movimentação que já vêm da Negociação", pulados]);
  if (tudo.proventos) fora.push(["Proventos (o Milhão calcula pelos dados da B3)", tudo.proventos]);
  if (tudo.foraBolsa) fora.push(["Tesouro, renda fixa, opções e outros que o Milhão não acompanha", tudo.foraBolsa]);
  for (const [k, v] of Object.entries(tudo.outros)) fora.push([k, v]);
  const semCot = [...new Set([...novos.map((l) => l.ticker), ...posNovas.map((p) => p.ticker)])].filter((t) => !S.porTicker[t]);
  const total = novos.length + posNovas.length;

  $("#imp-titulo").textContent = total ? `Importar ${plural(total, "item", "itens")} para ${c.nome}` : "Nada novo para importar";
  $("#imp-corpo").innerHTML = `
    ${itens.length ? `<ul class="imp-resumo">${itens.map(([k, v]) => `<li><span>${esc(k)}</span><b>${F.n0.format(v)}</b></li>`).join("")}</ul>` : ""}
    ${posNovas.length ? `<p class="imp-nota">A planilha de posição não traz o preço que você pagou. Coloque o preço médio de cada ativo (veja na sua corretora) para o resultado da carteira sair certo. Se deixar como está, o Milhão usa a cotação da planilha e a carteira começa em zero a zero.</p>
      <div class="imp-tabela"><table><thead><tr><th>Ativo</th><th>Quantidade</th><th>Preço médio (R$)</th></tr></thead><tbody>
      ${posNovas.map((p, k) => `<tr><td><b>${esc(p.ticker)}</b></td><td>${F.n0.format(p.qtd)}</td>
        <td><input type="number" step="0.01" min="0" data-pm="${k}" value="${(+p.preco || 0).toFixed(2)}" aria-label="Preço médio de ${esc(p.ticker)}"></td></tr>`).join("")}
      </tbody></table></div>` : ""}
    ${movTrocavel.length && tudo.tipos.has("negociacao") ? `<label class="imp-check"><input type="checkbox" id="imp-trocar" checked>
      <span>Trocar as ${plural(movTrocavel.length, "compra ou venda", "compras e vendas")} que vieram da Movimentação pelas da Negociação, que têm a data do pregão. Assim nada fica em dobro.</span></label>` : ""}
    ${posDif.length ? `<p class="imp-nota">A quantidade na B3 é diferente da carteira em ${posDif.map((p) => `${esc(p.ticker)} (B3: ${qtdF(p.qtd)}, carteira: ${qtdF(atual[p.ticker])})`).slice(0, 6).join(", ")}. Confira se falta algum lançamento.</p>` : ""}
    ${fora.length ? `<h3 style="margin:2px 0 -6px">Fica de fora</h3><ul class="imp-resumo">${fora.map(([k, v]) => `<li class="fora"><span>${esc(k)}</span><span>${F.n0.format(v)}</span></li>`).join("")}</ul>` : ""}
    ${semCot.length ? `<p class="fraco" style="margin:0">Sem cotação na base do Milhão: ${esc(semCot.slice(0, 8).join(", "))}${semCot.length > 8 ? "…" : ""}. Eles entram na carteira, mas sem valor atual.</p>` : ""}`;
  $("#imp-ok").textContent = total ? `Importar ${plural(total, "item", "itens")}` : "Fechar";
  dlg.returnValue = ""; if (!dlg.open) dlg.showModal();
  dlg.onclose = () => {
    if (dlg.returnValue !== "ok" || !total) return;
    if ($("#imp-trocar")?.checked) {
      const sai = new Set(movTrocavel.map((l) => l.id));
      c.lancamentos = c.lancamentos.filter((l) => !sai.has(l.id));
    }
    const hoje = hojeISO();
    $$("[data-pm]").forEach((inp) => {
      const p = posNovas[+inp.dataset.pm], pm = numeroBR(inp.value);
      novos.push({ id: novoId(), ticker: p.ticker, tipo: "C", data: hoje, qtd: p.qtd,
        preco: Number.isFinite(pm) && pm >= 0 ? pm : p.preco, origem: "b3-posicao", evento: "Posição na B3" });
    });
    c.lancamentos.push(...novos); salvar();
    aviso(`${plural(novos.length, "item importado", "itens importados")} para ${c.nome}`);
    if (location.hash === "#carteira") render(); else ir("#carteira");
  };
}

    const [, filtro, chave, dir] = PRESETS[UI.tipo][UI.preset];
    let lista = filtro(dados.filter((a) => a.tipo === UI.tipo));
    if (UI.setor) lista = lista.filter((a) => a.setor === UI.setor);
    for (const [k, , esc_] of FILTROS[UI.tipo]) {
      const mn = UI.filtros[k + "min"], mx = UI.filtros[k + "max"];
      if (mn !== undefined && mn !== "") lista = lista.filter((a) => a[k] != null && a[k] * esc_ >= +mn);
      if (mx !== undefined && mx !== "") lista = lista.filter((a) => a[k] != null && a[k] * esc_ <= +mx);
    }
    const ord = UI.ordem || chave, d = UI.ordem ? UI.dir : dir;
    lista.sort((a, b) => {
      const x = a[ord], y = b[ord];
      if (vazio(x) && vazio(y)) return 0; if (vazio(x)) return 1; if (vazio(y)) return -1;
      return (typeof x === "string" ? x.localeCompare(y) : x - y) * d;
    });
    $("#contagem").textContent = `${lista.length} ${UI.tipo === "fii" ? "fundos" : "ações"}`;
    $("#tabela").innerHTML = lista.length ? `<table><thead><tr><th>#</th>${COLS[UI.tipo].map(([k, n]) => `<th class="ordena ${k === "setor" || k === "t" ? "esq" : ""}" data-k="${k}" aria-sort="${ord === k ? (d > 0 ? "ascending" : "descending") : "none"}">${n}</th>`).join("")}</tr></thead>
      <tbody>${lista.map((a, i) => `<tr><td class="fraco">${i + 1}</td>${COLS[UI.tipo].map(([k, , f]) => k === "t"
        ? `<td class="esq"><a class="tk" href="#ativo-${a.t}">${a.t}</a><small>${esc(a.n)}</small></td>`
        : k === "setor" ? `<td class="esq sutil" style="max-width:150px;overflow:hidden;text-overflow:ellipsis" title="${esc(a.setor)}">${esc(a.setor)}</td>` : `<td>${f(a[k])}</td>`).join("")}</tr>`).join("")}</tbody></table>`
      : `<div class="vazio"><h3>Nenhum ativo passa nesses filtros</h3><p>Afrouxe um dos limites ou escolha outro setor.</p></div>`;
    $$("th.ordena").forEach((th) => th.onclick = () => {
      const k = th.dataset.k; UI.dir = UI.ordem === k ? -UI.dir : (k === "t" || k === "setor" ? 1 : -1); UI.ordem = k; desenhar();
    });
  };
  $$("[data-tipo]").forEach((b) => b.onclick = () => { UI.tipo = b.dataset.tipo; UI.preset = 0; UI.ordem = null; UI.setor = ""; UI.filtros = {}; render(); });
  $$("[data-preset]").forEach((b) => b.onclick = () => { UI.preset = +b.dataset.preset; UI.ordem = null; $$("[data-preset]").forEach((x) => x.setAttribute("aria-pressed", x === b)); desenhar(); });
  $("#f-setor").onchange = (e) => { UI.setor = e.target.value; desenhar(); };
  $$("[data-f]").forEach((i) => i.oninput = () => { UI.filtros[i.dataset.f + i.dataset.lim] = i.value; desenhar(); });
  desenhar();
};

/* ---------- tela: ativo ---------- */
/* ---------- valuation: fluxo de caixa descontado e modelo de dividendos ---------- */
const TAXA_PADRAO = 14, PERPETUO_PADRAO = 4; // % ao ano; o usuário ajusta na tela
const arred = (v, passo = 0.5) => Math.round(v / passo) * passo;
function baseFluxo(d, qual) {
  const f = d.fluxo || {}, anos = Object.entries(f.anual || {}).sort().map(([, v]) => v.fcl).filter((v) => !vazio(v));
  if (qual === "12m") return f["12m"]?.fcl ?? null;
  if (qual === "ano") return anos.at(-1) ?? null;
  const ult = anos.slice(-3);
  return ult.length ? ult.reduce((s, v) => s + v, 0) / ult.length : null;
}
function premissasSugeridas(d) {
  const cagr = d.ind?.cagr_rec;
  const g = vazio(cagr) ? 5 : Math.min(Math.max(arred(cagr * 100), 0), 12);
  return d.banco
    ? { taxa: TAXA_PADRAO + 1, perpetuo: PERPETUO_PADRAO, dpa: Math.round(d.preco * (d.ind?.dy || 0) * 100) / 100 }
    : { base: "media3", cresc: g, perpetuo: PERPETUO_PADRAO, taxa: TAXA_PADRAO };
}
function calcularFcd(d, p) {
  const fcl0 = baseFluxo(d, p.base), acoes = d.base?.acoes, dl = d.base?.divida_liquida ?? 0;
  const r = p.taxa / 100, gp = p.perpetuo / 100, g5 = p.cresc / 100;
  if (vazio(fcl0) || !acoes) return { erro: "Falta o fluxo de caixa ou a quantidade de ações desta empresa nos dados da CVM." };
  if (r <= gp) return { erro: "A taxa de desconto precisa ser maior que o crescimento na perpetuidade." };
  if (fcl0 <= 0) return { erro: "O fluxo de caixa livre está negativo na base escolhida, e aí o desconto de fluxos dá um valor negativo. Experimente outra base ou olhe Graham e Bazin.", fcl0 };
  const anos = []; let fcl = fcl0, somaVp = 0;
  for (let k = 1; k <= 10; k++) {
    const g = k <= 5 ? g5 : g5 + (gp - g5) * (k - 5) / 5;
    fcl *= 1 + g; const vp = fcl / (1 + r) ** k; somaVp += vp;
    anos.push({ k, g, fcl, vp });
  }
  const perp = fcl * (1 + gp) / (r - gp), vpPerp = perp / (1 + r) ** 10;
  const ev = somaVp + vpPerp, equity = ev - dl, preco = equity / acoes;
  return { fcl0, anos, somaVp, vpPerp, ev, dl, equity, acoes, preco, upside: preco / d.preco - 1 };
}
function calcularGordon(d, p) {
  const r = p.taxa / 100, g = p.perpetuo / 100;
  if (!(p.dpa > 0)) return { erro: "Sem dividendos nos últimos 12 meses: o modelo de dividendos não se aplica." };
  if (r <= g) return { erro: "O custo de capital precisa ser maior que o crescimento dos dividendos." };
  const preco = p.dpa * (1 + g) / (r - g);
  return { preco, upside: preco / d.preco - 1 };
}
function precoJustoSugerido(d) {
  const p = premissasSugeridas(d), res = d.banco ? calcularGordon(d, p) : calcularFcd(d, p);
  return res.erro ? null : res.preco;
}

function blocoFluxo(d) {
  const f = d.fluxo || {}, anos = Object.entries(f.anual || {}).sort().slice(-6);
  if (!anos.length && !f["12m"]) return "";
  const cols = [...anos.map(([a, v]) => [a, v]), ...(f["12m"]?.fco != null ? [["12 meses", f["12m"]]] : [])];
  const linha = (nome, k, forte) => `<tr${forte ? ' style="font-weight:700"' : ""}><td>${nome}</td>${cols.map(([, v]) => `<td class="${k === "fcl" ? cls(v[k]) : ""}">${compacto(v[k])}</td>`).join("")}</tr>`;
  return `<div class="painel" id="fluxo"><div class="cabeca" style="margin-bottom:8px"><h2 style="margin:0">Fluxo de caixa</h2>
      <span class="legenda"><span><i style="background:var(--verde-claro);outline:1px solid var(--verde)"></i>Caixa das operações</span><span><i style="background:var(--queda)"></i>Investimento em imobilizado e intangível</span><span><i style="background:var(--verde)"></i>Fluxo de caixa livre</span></span></div>
    <div class="grafico" id="g-fluxo"></div>
    <div style="overflow:auto;margin-top:10px"><table>
      <thead><tr><th>R$</th>${cols.map(([a]) => `<th>${esc(a)}</th>`).join("")}</tr></thead>
      <tbody>${linha("Caixa das operações", "fco")}${linha("Caixa de investimentos", "fci")}${linha("Caixa de financiamentos", "fcf")}
        ${linha("Compra de imobilizado e intangível", "capex")}${linha("Fluxo de caixa livre", "fcl", true)}</tbody></table></div>
    <p class="fraco" style="margin:10px 0 0">Fluxo de caixa livre = caixa das operações − compra de imobilizado e intangível. Dados da DFC enviada à CVM${f["12m"]?.referencia ? ", 12 meses até " + dataBR(f["12m"].referencia) : ""}.</p></div>`;
}
function graficoFluxo(el, d) {
  if (!el) return;
  const f = d.fluxo || {}, anos = Object.entries(f.anual || {}).sort().slice(-6);
  const itens = [...anos, ...(f["12m"]?.fco != null ? [["12m", f["12m"]]] : [])];
  if (!itens.length) { el.innerHTML = ""; return; }
  const series = [["fco", "var(--verde-claro)", "var(--verde)"], ["capex", "var(--queda)", null], ["fcl", "var(--verde)", null]];
  const vals = itens.flatMap(([, v]) => series.map(([k]) => v[k] || 0));
  const max = Math.max(0, ...vals), min = Math.min(0, ...vals);
  const L = Math.max(el.clientWidth, 320), A = 230, m = { t: 14, b: 26, e: 4, d: 4 };
  const Y = (v) => m.t + (max - v) / ((max - min) || 1) * (A - m.t - m.b), w = (L - m.e - m.d) / itens.length;
  const bw = Math.min(w * 0.22, 34);
  let svg = `<line x1="${m.e}" x2="${L - m.d}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--linha)"/>`;
  itens.forEach(([ano, v], i) => {
    const cx = m.e + w * i + w / 2;
    series.forEach(([k, cor, borda], j) => {
      const val = v[k] || 0, x = cx + (j - 1.5) * bw + 2, y = Math.min(Y(val), Y(0)), h = Math.abs(Y(val) - Y(0));
      svg += `<rect x="${x}" y="${y}" width="${bw - 4}" height="${Math.max(h, 1)}" rx="2" fill="${cor}" ${borda ? `stroke="${borda}"` : ""}><title>${esc(ano)}: ${esc(compacto(val))}</title></rect>`;
    });
    svg += `<text x="${cx}" y="${A - 6}" text-anchor="middle" font-size="12" fill="var(--tinta-3)">${esc(ano === "12m" ? "12 meses" : ano)}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${L} ${A}" height="${A}" role="img" aria-label="Fluxo de caixa por ano">${svg}</svg>`;
}

function blocoValuation(d) {
  const s = premissasSugeridas(d);
  const campo = (nome, rotulo, valor, passo = 0.5) => `<label class="campo">${rotulo}<input type="number" name="${nome}" value="${valor}" step="${passo}"></label>`;
  const form = d.banco

    : `<label class="campo">Fluxo de caixa de partida<select name="base">
         <option value="media3">Média dos últimos 3 anos</option><option value="12m">Últimos 12 meses</option><option value="ano">Último ano fechado</option></select></label>

  return `<div class="painel" id="valuation"><div class="cabeca" style="margin-bottom:12px"><div><h2 style="margin:0">${d.banco ? "Valuation pelo modelo de dividendos" : "Valuation por fluxo de caixa descontado"}</h2>
      <p class="fraco" style="margin:4px 0 0">${d.banco ? "Em bancos e seguradoras o caixa é a matéria-prima do negócio, então o preço justo sai dos dividendos que a empresa paga." : "Quanto valem hoje os fluxos de caixa que a empresa deve gerar daqui para a frente."}</p></div>

      <div id="r-fcd"></div></div></div>`;
}
function ligarValuation(d) {
  const f = $("#f-fcd"); if (!f) return;
  const ler = () => d.banco
    ? { dpa: numeroBR(f.dpa.value), perpetuo: numeroBR(f.perpetuo.value), taxa: numeroBR(f.taxa.value) }
    : { base: f.base.value, cresc: numeroBR(f.cresc.value), perpetuo: numeroBR(f.perpetuo.value), taxa: numeroBR(f.taxa.value) };
  const mostrar = () => {
    const p = ler(), res = d.banco ? calcularGordon(d, p) : calcularFcd(d, p), out = $("#r-fcd");
    if (res.erro) { out.innerHTML = `<div class="painel vazio" style="border-style:dashed"><h3>Não dá para calcular com essas premissas</h3><p>${esc(res.erro)}</p></div>`; return; }
    const cabeca = `<div class="numeros"><div><span>Preço justo</span><strong>${brl(res.preco)}</strong></div>
        <div><span>Preço atual</span><strong>${brl(d.preco)}</strong></div>
        <div><span>${res.upside >= 0 ? "Potencial até o preço justo" : "Acima do preço justo"}</span><strong class="${cls(res.upside)}">${pct(res.upside, 1, true)}</strong>
          <small class="fraco">${res.upside >= 0 ? "a ação está abaixo do preço justo" : "a ação está acima do preço justo"}</small></div></div>`;
    if (d.banco) { out.innerHTML = cabeca + `<p class="sutil" style="margin:14px 0 0">Preço justo = dividendo de ${brl(p.dpa)} × (1 + ${xv(p.perpetuo, 1)}%) ÷ (${xv(p.taxa, 1)}% − ${xv(p.perpetuo, 1)}%).</p>`; return; }
    // sensibilidade: taxa de desconto x crescimento na perpetuidade
    const taxas = [-2, -1, 0, 1, 2].map((x) => p.taxa + x), perps = [-1, -0.5, 0, 0.5, 1].map((x) => p.perpetuo + x);
    const grade = taxas.map((tx) => `<tr><th>${xv(tx, 1)}%</th>${perps.map((gp) => {
      const r2 = calcularFcd(d, { ...p, taxa: tx, perpetuo: gp });
      const atual = tx === p.taxa && gp === p.perpetuo;
      return `<td class="${r2.erro ? "" : cls(r2.upside)}" style="${atual ? "background:var(--verde-claro);font-weight:700" : ""}">${r2.erro ? "–" : brl(r2.preco)}</td>`;
    }).join("")}</tr>`).join("");
    out.innerHTML = cabeca + `
        <h3>Como o preço justo é montado</h3><table><tbody>
          <tr><td class="esq">Fluxo de caixa livre de partida</td><td>${compacto(res.fcl0)}</td></tr>
          <tr><td class="esq">Valor presente dos próximos 10 anos</td><td>${compacto(res.somaVp)}</td></tr>
          <tr><td class="esq">Valor presente da perpetuidade</td><td>${compacto(res.vpPerp)} <small class="fraco">(${pct(res.vpPerp / res.ev, 0)} do total)</small></td></tr>
          <tr style="font-weight:700"><td class="esq">Valor da empresa</td><td>${compacto(res.ev)}</td></tr>
          <tr><td class="esq">${res.dl >= 0 ? "Menos a dívida líquida" : "Mais o caixa líquido"}</td><td>${compacto(Math.abs(res.dl))}</td></tr>
          <tr style="font-weight:700"><td class="esq">Valor para os acionistas</td><td>${compacto(res.equity)}</td></tr>
          <tr><td class="esq">Dividido por ${F.n0.format(res.acoes)} ações</td><td><b>${brl(res.preco)}</b></td></tr></tbody></table>
        <h3>Preço justo com outras premissas</h3>
        <div style="overflow:auto"><table><thead><tr><th>Taxa de desconto ↓ / perpetuidade →</th>${perps.map((g) => `<th>${xv(g, 1)}%</th>`).join("")}</tr></thead><tbody>${grade}</tbody></table></div>
        <p class="fraco" style="margin:8px 0 0">Em verde, preços justos acima da cotação de hoje; em vermelho, abaixo. Em destaque, as premissas escolhidas.</p>
      <details style="margin-top:14px"><summary class="sutil" style="cursor:pointer">Ver a projeção ano a ano</summary>
        <div style="overflow:auto;margin-top:8px"><table><thead><tr><th>Ano</th><th>Crescimento</th><th>Fluxo de caixa livre</th><th>Valor presente</th></tr></thead>
        <tbody>${res.anos.map((a) => `<tr><td>${a.k}</td><td>${pct(a.g, 1)}</td><td>${compacto(a.fcl)}</td><td>${compacto(a.vp)}</td></tr>`).join("")}</tbody></table></div></details>`;
  };
  f.addEventListener("input", mostrar);

    const s = premissasSugeridas(d);
    for (const [k, v] of Object.entries(s)) if (f[k]) f[k].value = typeof v === "number" ? (k === "dpa" ? v.toFixed(2) : v) : v;
    mostrar();
  };
  mostrar();
}

function graficoProventos(d) {
  const porAno = {};
  for (const p of d.proventos || []) if (p.data_com) { const a = p.data_com.slice(0, 4); porAno[a] = (porAno[a] || 0) + p.valor; }
  const anoAtual = String(new Date().getFullYear());
  graficoBarras($("#g-div"), Object.entries(porAno).sort().slice(-6).map(([r, v]) => ({ r, v, parcial: r === anoAtual })), { formato: (v) => brl(v, 2) });
}

/* veredito em português claro: barata, no preço ou cara */
function veredito(d) {
  const fcd = precoJustoSugerido(d);
  const metodo = fcd ? (d.banco ? "pelos dividendos que o banco paga" : "pelo caixa que a empresa gera") : d.graham ? "pela fórmula de Graham (lucro e patrimônio)" : null;
  const justo = fcd || d.graham || null;
  if (!justo) return { justo: null, classe: "", titulo: "Sem dados para estimar", texto: "A empresa está com prejuízo ou sem histórico suficiente, então não dá para calcular um preço justo agora." };
  const up = justo / d.preco - 1;
  if (up > 0.15) return { justo, up, metodo, classe: "barata", titulo: "Parece barata", texto: `O preço justo estimado ${metodo} é ${brl(justo)}, ${pct(up, 0)} acima da cotação de hoje.` };
  if (up < -0.10) return { justo, up, metodo, classe: "cara", titulo: "Parece cara", texto: `O preço justo estimado ${metodo} é ${brl(justo)}, ${pct(-up, 0)} abaixo da cotação de hoje.` };
  return { justo, up, metodo, classe: "nopreco", titulo: "Perto do preço justo", texto: `O preço justo estimado ${metodo} é ${brl(justo)}, bem perto da cotação de hoje.` };
}
function blocoVeredito(d, grande = false) {
  const v = veredito(d);
  return `<div class="veredito ${v.classe}${grande ? " grande" : ""}">
      <div><span class="rotulo">${v.justo ? "Preço justo estimado" : "Preço justo"}</span><strong>${v.justo ? brl(v.justo) : "–"}</strong></div>
      <div><span class="selo-v">${v.titulo}</span><p>${v.texto}</p>
        ${grande ? "" : `<a href="#" data-ir-aba="preco">Entender a conta</a>`}</div></div>`;
}
function nivelDivida(d) {
  const dl = d.base?.divida_liquida, eb = d.ind?.dl_ebitda;
  if (d.banco) return null;
  if (vazio(dl)) return { nivel: "–", texto: "Sem dados de dívida." };
  if (dl <= 0) return { nivel: "Sem dívida", texto: "Tem mais dinheiro em caixa do que dívidas." };
  if (vazio(eb) || eb < 0) return { nivel: "Atenção", texto: `Deve ${compacto(dl)} e o resultado operacional não cobre com folga.` };
  if (eb < 1.5) return { nivel: "Baixa", texto: `Pagaria a dívida em ${xv(eb, 1)} ano${eb >= 2 ? "s" : ""} de geração de caixa.` };
  if (eb < 3) return { nivel: "Moderada", texto: `Pagaria a dívida em ${xv(eb, 1)} anos de geração de caixa.` };
  return { nivel: "Alta", texto: `Precisaria de ${xv(eb, 1)} anos de geração de caixa para pagar a dívida.` };
}

/* ---------- preço teto: preço justo pelo fluxo de caixa menos a margem de segurança ---------- */
const margemSeguranca = () => S.estado?.margem ?? 0.25;
function precoTeto(d) {
  const j = d && d.tipo !== "fii" ? precoJustoSugerido(d) : null;
  return j ? j * (1 - margemSeguranca()) : null;
}
function blocoTeto(d) {
  const teto = precoTeto(d), justo = precoJustoSugerido(d), m = margemSeguranca();
  const abaixo = teto && d.preco <= teto;
  return `<div class="painel teto" id="teto">
    <div><span class="rotulo">Preço teto pelo ${d.banco ? "modelo de dividendos" : "fluxo de caixa"}</span>
      <strong>${teto ? brl(teto) : "Não se aplica agora"}</strong>
      ${teto ? `<p>É até onde vale pagar para ter <b>${pct(m, 0)}</b> de margem de segurança sobre o preço justo de ${brl(justo)}.
        Hoje a cotação de ${brl(d.preco)} está <b class="${abaixo ? "alta" : "baixa"}">${abaixo ? "abaixo do teto" : "acima do teto"}</b>.</p>`
        : `<p>Sem preço justo pelo fluxo de caixa para esta empresa, não dá para calcular o teto.</p>`}</div>
    <label class="campo margem">Margem de segurança<span><input type="number" id="margem" min="0" max="90" step="5" value="${Math.round(m * 100)}"> %</span></label>
  </div>`;
}
function ligarTeto(d) {
  const campo = $("#margem"); if (!campo) return;
  campo.onchange = () => {
    const v = Math.min(Math.max(numeroBR(campo.value), 0), 90), caixa = $("#teto");
    if (!Number.isFinite(v) || !caixa?.isConnected || v / 100 === margemSeguranca()) return;
    S.estado.margem = v / 100; salvar();
    const novo = document.createElement("div"); novo.innerHTML = blocoTeto(d);
    caixa.replaceWith(novo.firstElementChild); ligarTeto(d);
  };
}
