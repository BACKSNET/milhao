    });
  };
  const mostrar = () => {
    gr.dados(agruparVelas(dados, cfg.tempo), cfg.tempo);
    aplicar();
    gr.periodo(Math.max(12, Math.ceil(PERIODOS[cfg.periodo] / DIVISOR_TEMPO[cfg.tempo])));
  };
  gr.aoDuploClique = () => gr.periodo(Math.max(12, Math.ceil(PERIODOS[cfg.periodo] / DIVISOR_TEMPO[cfg.tempo])));
  $$("[data-tempo]").forEach((b) => b.onclick = () => { cfg.tempo = b.dataset.tempo; $$("[data-tempo]").forEach((x) => x.setAttribute("aria-pressed", x === b)); mostrar(); });
  $$("[data-per]").forEach((b) => b.onclick = () => { cfg.periodo = b.dataset.per; $$("[data-per]").forEach((x) => x.setAttribute("aria-pressed", x === b)); gr.aoDuploClique(); });
  $$("[data-ind]").forEach((x) => x.onchange = () => { cfg.ind[x.dataset.ind] = x.checked; aplicar(); });
  mostrar();
  $("#leitura").innerHTML = leituraGrafico(dados, pos, teto, d);
};
/* leitura em português claro do que o gráfico mostra (sempre no diário) */
function leituraGrafico(dados, pos, teto, d) {
  const c = dados.c, n = c.length, ult = c[n - 1];
  const mm50 = mediaMovel(c, 50)[n - 1], mm200 = mediaMovel(c, 200)[n - 1], forca = indiceForcaRelativa(c)[n - 1];
  const ano = Math.max(0, n - 252), max52 = Math.max(...dados.h.slice(ano)), min52 = Math.min(...dados.l.slice(ano));
  const onde = max52 > min52 ? (ult - min52) / (max52 - min52) : null;
  const tendencia = mm200 === null
    ? ["Pouco histórico", "Ainda não há 200 pregões para medir a tendência longa."]
    : ult >= mm200 && (mm50 ?? ult) >= mm200 ? ["Alta no longo prazo", "A cotação e a média de 50 dias estão acima da média de 200 dias."]
    : ult < mm200 && (mm50 ?? ult) < mm200 ? ["Baixa no longo prazo", "A cotação e a média de 50 dias estão abaixo da média de 200 dias."]
    : ["Indefinida", "A cotação está cruzando a média de 200 dias: o mercado ainda não escolheu direção."];
  const ifrTxt = forca === null ? ["–", "Pouco histórico."]
    : forca >= 70 ? [xv(forca, 0), "Subiu forte nos últimos dias. Costuma ser chamado de sobrecompra."]
    : forca <= 30 ? [xv(forca, 0), "Caiu forte nos últimos dias. Costuma ser chamado de sobrevenda."]
    : [xv(forca, 0), "Sem exagero para cima nem para baixo."];
  const cartoes = [];
  if (pos) cartoes.push(["Sua posição", `${qtdF(pos.qtd)} ${S.porTicker[pos.ticker]?.tipo === "fii" ? "cotas" : "ações"}`,
    `Preço médio de ${brl(pos.pm)}. Resultado de <b class="${cls(pos.resultado)}">${brl(pos.resultado)}</b> (${pct(pos.custo ? pos.resultado / pos.custo : null, 1, true)}). A cotação está ${pct(Math.abs(ult / pos.pm - 1), 1)} ${ult >= pos.pm ? "acima" : "abaixo"} do seu preço médio.`]);
  if (teto) cartoes.push(["Preço teto", brl(teto), `Pelo ${d?.banco ? "modelo de dividendos" : "fluxo de caixa"}, com ${pct(margemSeguranca(), 0)} de margem. Hoje está <b class="${ult <= teto ? "alta" : "baixa"}">${ult <= teto ? "abaixo do teto" : "acima do teto"}</b>.`]);
  cartoes.push(["Tendência", tendencia[0], tendencia[1]]);
  cartoes.push(["IFR de 14 dias", ifrTxt[0], ifrTxt[1]]);
  cartoes.push(["Últimas 52 semanas", `${brl(min52)} a ${brl(max52)}`, onde === null ? "" : `Hoje está a ${pct(onde, 0)} do caminho entre a mínima e a máxima do ano.`]);
  return `<div class="cartoes">${cartoes.map(([nm, v, tx]) => `<div><span>${nm}</span><strong>${v}</strong><p>${tx}</p></div>`).join("")}</div>
    <p class="fraco" style="margin:0">Leitura automática dos números do gráfico. Não é recomendação de compra ou venda.</p>`;
}

/* ---------- seletor de carteiras: resumo de cada carteira e o mercado do dia ---------- */
function resumoCarteira(c) {
  const pos = posicoes(c).filter((p) => p.qtd > 0);
  let total = 0, custo = 0, dia = 0, renda = 0;
  for (const p of pos) {
    const a = S.porTicker[p.ticker], v = p.valor || 0;
    total += v; custo += p.custo;
    if (a?.var_dia != null) dia += v - v / (1 + a.var_dia);
    renda += v * (a?.dy || 0);
  }
  return { pos, total, custo, dia, diaPct: total ? dia / (total - dia) : null, resultado: total - custo,
    resultadoPct: custo ? (total - custo) / custo : null, yield: total ? renda / total : null };
}
function miniGrafico(pontos) {
  if (pontos.length < 2) return "";
  const vs = pontos.map((p) => p.v), mn = Math.min(...vs), mx = Math.max(...vs) || 1;
  const pts = vs.map((v, i) => `${(i / (vs.length - 1) * 100).toFixed(2)},${(36 - ((v - mn) / ((mx - mn) || 1)) * 32).toFixed(2)}`).join(" ");
  const cor = vs.at(-1) >= vs[0] ? "var(--verde-2)" : "var(--queda)";
  return `<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${cor}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function blocoMercado() {
  const liquidas = S.ativos.filter((a) => a.var_dia != null && (a.liq || 0) >= 2e6);
  const altas = [...liquidas].sort((a, b) => b.var_dia - a.var_dia).slice(0, 5);
  const baixas = [...liquidas].sort((a, b) => a.var_dia - b.var_dia).slice(0, 5);
  const negociadas = [...S.ativos].sort((a, b) => (b.liq || 0) - (a.liq || 0)).slice(0, 5);
  const lista = (titulo, itens, extra) => `<div class="painel mercado-lista"><h3>${titulo}</h3><ol>${itens.map((a) => `<li>
      <a class="mercado-ativo" href="#ativo-${a.t}"><b>${esc(a.t)}</b><span>${esc(a.n)}</span></a>
      <span class="mercado-num">${extra === "liq" ? compacto(a.liq) : brl(a.preco)}<em class="${cls(a.var_dia)}">${pct(a.var_dia, 2, true)}</em></span>
      <a class="ir-grafico" href="#analise-${a.t}" title="Ver ${esc(a.t)} no gráfico de candles" aria-label="Ver ${esc(a.t)} no gráfico de candles">${ICO.analise}</a></li>`).join("")}</ol></div>`;
  return `<section class="mercado"><div class="cabeca" style="margin:34px 0 12px"><h2 style="margin:0">Mercado hoje</h2><span class="fraco">Fechamento de ${dataBR(S.meta?.ultimo_pregao)}</span></div>
    <div class="grade g-3">${lista("Maiores altas", altas)}${lista("Maiores baixas", baixas)}${lista("Mais negociadas", negociadas, "liq")}</div></section>`;
}

/* ---------- tela: ferramentas ---------- */
rotas.ferramentas = (el) => {
  el.innerHTML = `<div class="cabeca"><div><h1>Ferramentas</h1><p class="sutil" style="margin:6px 0 0">Simule quanto o dinheiro cresce e quanto tempo falta para o primeiro milhão.</p></div></div>
    <div class="painel"><h2>Juros compostos</h2><div class="calc">
      <form id="f-juros">
        <label class="campo">Valor inicial (R$)<input type="number" name="ini" value="10000" min="0" step="100"></label>
        <label class="campo">Aporte mensal (R$)<input type="number" name="mes" value="1000" min="0" step="50"></label>
        <label class="campo">Rentabilidade (% ao ano)<input type="number" name="taxa" value="10" step="0.1"></label>
        <label class="campo">Prazo (anos)<input type="number" name="anos" value="15" min="1" max="60" step="1"></label>
      </form>
      <div><div class="numeros" id="r-juros"></div><div class="grafico" id="g-juros" style="margin-top:14px"></div></div></div></div>
    <div class="painel"><h2>Quanto falta para o milhão</h2><div class="calc">
      <form id="f-milhao">
        <label class="campo">Quanto você já tem (R$)<input type="number" name="ini" value="25000" min="0" step="1000"></label>
        <label class="campo">Aporte mensal (R$)<input type="number" name="mes" value="1500" min="0" step="50"></label>
        <label class="campo">Rentabilidade (% ao ano)<input type="number" name="taxa" value="10" step="0.1"></label>
      </form>
      <div id="r-milhao"></div></div></div>`;
  const simular = (ini, mes, taxa, meses) => {
    const im = Math.pow(1 + taxa / 100, 1 / 12) - 1; let v = ini, inv = ini; const pts = [{ m: 0, v, inv }];
    for (let k = 1; k <= meses; k++) { v = v * (1 + im) + mes; inv += mes; pts.push({ m: k, v, inv }); }
    return pts;
  };
  const rotulo = (m) => { const d = new Date(); d.setMonth(d.getMonth() + m); return d.toISOString().slice(0, 10); };
  const juros = () => {
    const f = new FormData($("#f-juros")), pts = simular(+f.get("ini"), +f.get("mes"), +f.get("taxa"), +f.get("anos") * 12), u = pts.at(-1);
    $("#r-juros").innerHTML = `<div><span>Valor final</span><strong class="alta">${brl(u.v, 0)}</strong></div><div><span>Total investido</span><strong>${brl(u.inv, 0)}</strong></div><div><span>Ganho com juros</span><strong>${brl(u.v - u.inv, 0)}</strong></div>`;
    graficoLinha($("#g-juros"), pts.map((p) => ({ d: rotulo(p.m), v: p.v })), { altura: 240, segunda: pts.map((p) => ({ d: rotulo(p.m), v: p.inv })), formato: (v) => compacto(v) });
  };
  const milhao = () => {
    const f = new FormData($("#f-milhao")), pts = simular(+f.get("ini"), +f.get("mes"), +f.get("taxa"), 12 * 80);
    const k = pts.findIndex((p) => p.v >= 1e6);
    $("#r-milhao").innerHTML = k < 0 ? `<p class="resultado-grande" style="color:var(--tinta-2)">Mais de 80 anos</p><p class="sutil">Aumente o aporte ou a rentabilidade para chegar lá.</p>`
      : `<p class="sutil" style="margin:0">Você chega a R$ 1 milhão em</p><p class="resultado-grande" style="margin:4px 0">${Math.floor(k / 12)} anos e ${k % 12} ${k % 12 === 1 ? "mês" : "meses"}</p>
         <p class="sutil">Por volta de ${new Date(rotulo(k)).toLocaleDateString("pt-BR", { month: "long", year: "numeric" })}. Até lá, você coloca ${brl(pts[k].inv, 0)} do bolso e os juros rendem ${brl(pts[k].v - pts[k].inv, 0)}.</p>`;
  };
  $("#f-juros").oninput = juros; $("#f-milhao").oninput = milhao; juros(); milhao();
};

/* ---------- início ---------- */
async function iniciar() {
  S.estado = carregarEstado();
  S.nuvem = iniciarNuvem();
  if (S.nuvem) {
    // link de "esqueci minha senha": o Supabase avisa com PASSWORD_RECOVERY e a pessoa cria a senha nova
    S.nuvem.auth.onAuthStateChange((evento) => {
      if (evento !== "PASSWORD_RECOVERY") return;
      S.recuperando = true;
      if (S.ativos.length) setTimeout(() => telaLogin(curvaEntrada(), "nova"), 0);
    });
    const { data } = await S.nuvem.auth.getSession();
    if (data.session) await abrirConta(data.session.user);
    else S.estado = { perfil: null, carteiras: [], ativa: null };
    if (/[?&]code=/.test(location.search)) history.replaceState(null, "", SITE + location.hash);
  }
  try {
    [S.meta, S.ativos] = await Promise.all([j("data/meta.json"), j("data/ativos.json")]);
  } catch (e) {
    $("#raiz").innerHTML = `<main class="conteudo"><div class="marca" style="font-size:36px;margin-bottom:24px">Milhão.</div><div class="painel vazio"><h3>Os dados do mercado ainda não foram gerados</h3><p>Rode o robô de dados (etl/milhao_dados.py) ou espere a próxima atualização automática. Detalhe: ${esc(e.message)}</p></div></main>`;
    return;
  }
  S.porTicker = Object.fromEntries(S.ativos.map((a) => [a.t, a]));
  $("#lista-tickers").innerHTML = S.ativos.map((a) => `<option value="${a.t}">${esc(a.n)}</option>`).join("");
  if (S.recuperando) return telaLogin(curvaEntrada(), "nova");
  render();
}
iniciar();
</script>
