name: Desempacotar arquivos

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  desempacotar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar e remover o zip
        run: |
          if [ ! -f milhao-github.zip ]; then echo "nada a fazer"; exit 0; fi
          unzip -o milhao-github.zip -x '.github/*'
          git rm -q milhao-github.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Desempacota os arquivos do Milhão"
          git push
